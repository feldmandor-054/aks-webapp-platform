# CI: lint + test -> build image -> vulnerability scan -> push immutable tag -> deploy to dev.
# The image is built once and promoted by tag; it is never rebuilt for another environment.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "infra/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for env in dev prod; do
            helm lint charts/webapp -f charts/webapp/values-$env.yaml --strict
            helm template webapp charts/webapp -f charts/webapp/values-$env.yaml \
              --set image.tag=test > /dev/null
          done

  build:
    name: Build, scan & push image
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and immutable tag
        id: meta
        run: |
          owner="${{ github.repository_owner }}"
          echo "image=ghcr.io/${owner,,}/webapp" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (local only, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: fail the build on fixable HIGH/CRITICAL findings (table output is readable in the log).
      - name: Trivy vulnerability gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Report: SARIF for the Security tab. The action's SARIF mode ignores the severity filter
      # and reports everything, so this step must never be the gate.
      - name: Trivy SARIF report (all severities)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          skip-setup-trivy: true
        env:
          TRIVY_SKIP_DB_UPDATE: "true"

      - name: Upload scan results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (sha tag + latest)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}`'
            echo
            echo "Promote to prod: run **Deploy** with environment=prod, image_tag=${{ steps.meta.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy to dev
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.tag }}
